[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realaiagent"
version = "0.3.0"
description = "RealAI Agent - a fully local, owner-controlled cognitive AI agent with its own mind, built-in learning, permissions, and device control. Pure Python stdlib. No external AI, no external APIs."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Xodjayev-aa" }]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = []

[project.scripts]
realai = "realaiagent.__main__:main"

[tool.setuptools.packages.find]
include = ["realaiagent*"]
